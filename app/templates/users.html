{% extends "base.html" %}{% block content %}
<div class="card"><h2>Users &amp; roles</h2><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr>
{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.full_name }}</td><td>{{ u.role }}</td><td>{{ 'Yes' if u.active else 'No' }}</td>
<td>{% if u.username!='admin' %}<form method="post" action="{{ url_for('admin.toggle_user', uid=u.id) }}"><button class="btn secondary">{{ 'Disable' if u.active else 'Enable' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></div>
<form method="post" class="card"><h3>Add user</h3><div class="grid">
<div><label>Username</label><input name="username" required></div><div><label>Full name</label><input name="full_name"></div>
<div><label>Role</label><select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></div>
<div><label>Password</label><input name="password" type="password" minlength="6" required></div></div><p><button class="btn">Create</button></p></form>
{% endblock %}
